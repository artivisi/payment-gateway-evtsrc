spring:
  application:
    name: payment-gateway-evtsrc
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_gateway_reporting}
    username: ${SPRING_DATASOURCE_USERNAME:pguser}
    password: ${SPRING_DATASOURCE_PASSWORD:pgpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: payment-gateway-streams-engine
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        state.dir: ${ROCKSDB_STATE_DIR:./target/rocksdb}
        num.stream.threads: 6
        num.standby.replicas: 0 # Starter 1-node footprint setup
    listener:
      type: batch
      concurrency: ${app.kafka.partitions:6}

app:
  kafka:
    partitions: ${APP_KAFKA_PARTITIONS:6} # Starter tier partition count per README §4.3; drives topic creation + listener/streams concurrency
  topics:
    charge-events: charge-events
    va-events: va-events
    payment-events: payment-events
    reconciliation-events: reconciliation-events
    webhook-events: webhook-events
  migration:
    seed-from-postgres: ${APP_MIGRATION_SEED_FROM_POSTGRES:false}
  bank-secrets:
    secrets:
      # BSI proprietary-checksum shared secret: SHA1(nomorPembayaran + secret + tanggalTransaksi).
      # PLACEHOLDER ONLY -- override per environment via BANK_SECRET_BSI. Do not deploy this value.
      bsi: ${BANK_SECRET_BSI:CHANGE_ME_BSI_SHARED_SECRET_NOT_FOR_PRODUCTION}
